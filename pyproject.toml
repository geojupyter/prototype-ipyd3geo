[project]
name = "ipyd3geo"
version = "0.4.0"
description = "An interactive map widget for Jupyter that uses D3 Geo as its renderer."
readme = "README.md"
license = "BSD-3-Clause"
authors = [
    { name = "Benjamin Szeghy", email = "benjamin.szeghy@berkeley.edu" }
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "anywidget>=0.11.0",
]

[project.urls]
Repository = "https://github.com/geojupyter/prototype-ipyd3geo"
Issues = "https://github.com/geojupyter/prototype-ipyd3geo/issues"

[build-system]
requires = ["hatchling", "hatch-jupyter-builder>=0.10.0"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["src/ipyd3geo/static/"]

[tool.hatch.build.hooks.jupyter-builder]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = ["src/ipyd3geo/static/widget.js"]
optional-editable-build = "true"

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
npm = "pnpm"
build_cmd = "build"
build_dir = "src/ipyd3geo/static"
source_dir = "js"

[tool.hatch.build.targets.sdist]
include = [
    "src/ipyd3geo",
    "js",
    "package.json",
    "pnpm-lock.yaml",
    "pnpm-workspace.yaml",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]

[dependency-groups]
dev = [
    "geopandas>=1.1.4",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "nbmake>=1.5.5",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
]
docs = [
    "jupyterlite-pyodide-kernel[lock]>=0.8.6",
    "jupyterlite-sphinx>=0.23.0",
    "myst-parser>=5.1.0",
    "pydata-sphinx-theme>=0.21.0",
    "sphinx>=9.1.0",
    "sphinx-autodoc-typehints>=3.13.7",
]

[tool.uv.dependency-groups]
docs = { requires-python = ">=3.12" }

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # D203/D213 are mutually exclusive with D211/D212; one of each pair must go.
    "D203",
    "D213",
    # Ruff's own docs: these conflict with `ruff format` and cause fix loops.
    "COM812",
    "ISC001",
    # Copyright headers are a legal assertion the author hasn't chosen to make;
    # licensing is declared in LICENSE and pyproject.toml instead.
    "CPY001",
    # Google/Napoleon style documents constructor arguments in the class
    # docstring (see `Args:` there), which Sphinx renders; a second docstring on
    # __init__ would just duplicate it.
    "D107",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Sphinx executes conf.py as a script, so it is not (and must not be) a package.
# Sphinx also requires the config variable to be named `copyright`.
"docs/conf.py" = ["INP001", "A001"]
# pytest relies on bare asserts.
"tests/**" = ["S101"]
